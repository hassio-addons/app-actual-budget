proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_max_temp_file_size    0;

# Importing a year of transactions, or a budget file from another tool, is one
# request that Actual works through before it answers.
proxy_read_timeout          600s;
proxy_send_timeout          600s;

# The page has to arrive uncompressed, or the Ingress rewrite would be looking
# at gzip rather than at the document. Nothing is lost by it: Actual serves the
# client without compressing it, and NGINX compresses on the way out.
proxy_set_header Accept-Encoding "";

# Actual builds the OpenID callback address out of the address the request came
# in on, so it has to survive the proxy.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
